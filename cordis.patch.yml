# Agensi (https://mcp.agensi.io/mcp/auth) as an MCP server for DeepSeek Harness.
#
# Agensi is a remote MCP endpoint protected by OAuth 2.1. Its discovery documents say
# everything a connector needs:
#
#   protected resource metadata    /.well-known/oauth-protected-resource/mcp/auth
#   authorization server metadata  /.well-known/oauth-authorization-server
#     registration_endpoint  /oauth/register   (dynamic client registration, public client)
#     code_challenge_methods S256               (PKCE required)
#     grant_types            authorization_code + refresh_token
#     scopes                 read, install
#
# The harness MCP client speaks a URL plus static `headers` only — no `authProvider`, no
# token store, no interactive step. The Host half (`index.js`) therefore owns the
# authorization: it registers a client, runs the authorization-code flow with PKCE and a
# loopback callback, keeps the result in a private file, and hands the access token to the
# row below. The plugin page (`client.js`) is where a user starts that flow and reads its
# state; no token is ever written into this repository or typed into the conversation.
#
# Config expressions are evaluated before any plugin runs, so the header expression reads
# the file synchronously through `process.getBuiltinModule` instead of waiting for a
# service. Every credential change (sign-in, renewal, sign-out) is followed by a reload of
# this row, which is what makes a new token apply without a restart.
#
# Keep the two rows in this order: the Host half writes the file the second row reads.
- insert:
    # Bundle's own Host half: OAuth sign-in, token renewal, and the card's four routes.
    - id: dsh-agensi-mcp
      name: 'dsh-agensi-mcp'
      config: {}
    - id: agensi-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: agensi
        transport: streamable-http
        url: https://mcp.agensi.io/mcp/auth
        # Only the header that exists is built, so an empty value can never shadow a real
        # one. The path mirrors index.js: $DSH_HOME (or ~/.dsh), then
        # dsh-runtimes/agensi-mcp/config.json.
        headers: !!js "(() => { try { const fs = process.getBuiltinModule('fs'), path = process.getBuiltinModule('path'), os = process.getBuiltinModule('os'), home = process.env.DSH_HOME || path.join(os.homedir(), '.dsh'), config = JSON.parse(fs.readFileSync(path.join(home, 'dsh-runtimes', 'agensi-mcp', 'config.json'), 'utf8')), headers = {}; if (typeof config.accessToken === 'string' && config.accessToken) headers.Authorization = 'Bearer ' + config.accessToken; return headers; } catch (error) { return {}; } })()"
        # Keep the harness healthy while the credential is missing, expired or revoked:
        # the failure is logged and the row reports its own transport error instead of
        # rejecting startup.
        failOnStartupError: false
        # Installing a skill can take a while on the marketplace side.
        toolCallTimeoutMs: 120000
        # A row that gave up stays dead (`maxAttempts` is one-way); keep retrying with a
        # bounded delay so a new sign-in applies after the row is re-composed.
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 5000
          maxAttempts: 50
